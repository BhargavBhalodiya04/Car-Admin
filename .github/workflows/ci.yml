name: Car-Admin CI

on:
  push:
    branches: [ "main", "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint

    - name: Build Next.js Application
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: https://placeholder-project.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder

    - name: Install Playwright Browsers
      run: npx playwright install chromium --with-deps

    - name: Run Playwright Tests (E2E)
      run: npm run test:e2e

    - name: Package Build Artifacts (Zip)
      run: |
        sudo apt-get install -y zip
        zip -r next-build-artifact.zip .next public package.json package-lock.json

    - name: Upload Build Artifact Zip
      uses: actions/upload-artifact@v4
      with:
        name: next-build-artifact-zip
        path: next-build-artifact.zip
