name: Car-Admin CI & APK Build

on:
  push:
    branches: [ "main", "*" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        distribution: 'zulu'
        java-version: '21'

    - name: Install dependencies
      run: npm ci

    - name: Run Linter
      run: npm run lint

    - name: Build Next.js Application (Static Export)
      run: npm run build
      env:
        NEXT_PUBLIC_SUPABASE_URL: https://placeholder-project.supabase.co
        NEXT_PUBLIC_SUPABASE_ANON_KEY: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.placeholder

    - name: Sync Web Assets with Capacitor
      run: npx cap sync android

    - name: Build Android Debug APK with Gradle
      run: |
        cd android
        chmod +x gradlew
        ./gradlew assembleDebug

    - name: Upload Compiled Android APK (Zip Artifact)
      uses: actions/upload-artifact@v4
      with:
        name: car-admin-android-apk-zip
        path: android/app/build/outputs/apk/debug/app-debug.apk
